name: Secure one-time Netlify deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/secure-netlify-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate ephemeral encryption key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/netlify-private.pem
          openssl rsa -pubout -in /tmp/netlify-private.pem -out /tmp/netlify-public.pem

      - name: Publish ephemeral public key
        uses: actions/upload-artifact@v4
        with:
          name: netlify-deploy-public-key
          path: /tmp/netlify-public.pem
          retention-days: 1

      - name: Wait for encrypted Netlify proxy
        run: |
          for i in $(seq 1 60); do
            git fetch origin main --quiet
            if git show origin/main:.github/netlify-proxy.enc > /tmp/netlify-proxy.enc 2>/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Encrypted proxy payload was not provided in time."
          exit 1

      - name: Decrypt proxy and deploy current main
        run: |
          openssl pkeyutl -decrypt             -inkey /tmp/netlify-private.pem             -in /tmp/netlify-proxy.enc             -out /tmp/netlify-proxy.txt             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256
          NETLIFY_PROXY_PATH="$(cat /tmp/netlify-proxy.txt)"
          rm -f /tmp/netlify-proxy.txt /tmp/netlify-proxy.enc
          npx -y @netlify/mcp@latest             --site-id 7645697b-e0da-4d93-9320-d40ca2a2d184             --proxy-path "$NETLIFY_PROXY_PATH"
